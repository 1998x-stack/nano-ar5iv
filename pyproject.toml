# Architecture-only package metadata; not a working converter or CLI.
# LaTeXML, ar5ivist and Python runtime dependencies are NOT installed here.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-ar5iv"
version = "0.0.0"
description = "Placeholder architecture for reliable LaTeX scientific document conversion"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
