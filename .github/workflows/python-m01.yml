name: Python M01-M04 tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-m01.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run unit / fake engine tests
        env:
          RUN_REAL_LATEXML: "0"
        run: python -m unittest discover -s tests -v
      - name: Byte-compile modules
        run: python -m compileall -q src tests

  real-latexml-smoke:
    name: Real LaTeXML/ar5ivist smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local package
        run: python -m pip install -e .
      - name: Pull the explicitly versioned upstream image
        run: docker pull latexml/ar5ivist:2512.17
      - name: Run the self-authored TeX integration fixture
        env:
          RUN_REAL_LATEXML: "1"
        run: python -m unittest discover -s tests -p 'test_real_latexml_opt_in.py' -v

      - name: Real M02 metadata-driven auto-entry conversion
        env:
          RUN_REAL_LATEXML: "1"
        run: python -m unittest discover -s tests -p 'test_real_m02_opt_in.py' -v

      - name: Real M03 bounded fragment-wrapper conversion
        env:
          RUN_REAL_LATEXML: "1"
        run: python -m unittest discover -s tests -p 'test_real_m03_opt_in.py' -v

      - name: Real M04 ar5ivist HTML to canonical PaperDocument
        env:
          RUN_REAL_LATEXML: "1"
        run: python -m unittest discover -s tests -p 'test_real_m04_opt_in.py' -v

      - name: Run complete M01 CLI and check checksums
        shell: bash
        run: |
          set -euo pipefail
          nano-ar5iv --output "$RUNNER_TEMP/nano-ar5iv-e2e" convert \
            examples/trusted-minimal --entry manuscript.tex --timeout 300 \
            > "$RUNNER_TEMP/nano-result.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "nano-result.json").read_text())
          assert result["status"] == "SUCCEEDED", result
          assert result["quality_status"] == "NOT_EVALUATED", result
          path = Path(result["manifest_path"])
          manifest = json.loads(path.read_text())
          assert manifest["root_entry"] == "manuscript.tex"
          assert manifest["engine_attempt"]["image_id"].startswith("sha256:")
          assert manifest["engine_attempt"]["exit_code"] == 0
          artifacts = {f["path"]: f for f in manifest["artifacts"]}
          assert "html/index.html" in artifacts, artifacts
          for name, record in artifacts.items():
              data = (path.parent / "artifacts" / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == record["sha256"], name
          print("M01_REAL_CLI_E2E_PASS", manifest["source_bundle_id"],
                manifest["engine_attempt"]["image_id"], len(artifacts))
          PY
