name: Python M01 unit tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-m01.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run unit / fake engine tests
        env:
          RUN_REAL_LATEXML: "0"
        run: python -m unittest discover -s tests -v
      - name: Byte-compile modules
        run: python -m compileall -q src tests

  real-latexml-smoke:
    name: Real LaTeXML/ar5ivist smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local package
        run: python -m pip install -e .
      - name: Pull the explicitly versioned upstream image
        run: docker pull latexml/ar5ivist:2512.17
      - name: Run the self-authored TeX integration fixture
        env:
          RUN_REAL_LATEXML: "1"
        run: python -m unittest discover -s tests -p 'test_real_latexml_opt_in.py' -v

      - name: M02 actual entry discovery and bounded Docker probe
        shell: bash
        run: |
          set -euo pipefail
          nano-ar5iv --output "$RUNNER_TEMP/nano-m02" discover examples/trusted-minimal > "$RUNNER_TEMP/m02-discover.json"
          nano-ar5iv --output "$RUNNER_TEMP/nano-m02" probe examples/trusted-minimal --top-k 1 --timeout 180 > "$RUNNER_TEMP/m02-probe.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          discovered = json.loads((temp / "m02-discover.json").read_text())
          probed = json.loads((temp / "m02-probe.json").read_text())
          assert discovered["status"] == "SELECTED", discovered
          assert discovered["selected_roots"] == ["manuscript.tex"], discovered
          assert probed["quality_status"] == "NOT_EVALUATED", probed
          assert probed["auto_selected"] is False, probed
          assert len(probed["attempts"]) == 1, probed
          attempt = probed["attempts"][0]
          assert attempt["entry"] == "manuscript.tex" and attempt["status"] == "SUCCEEDED", attempt
          manifest = json.loads(Path(attempt["manifest_path"]).read_text())
          assert manifest["quality_status"] == "NOT_EVALUATED", manifest
          assert manifest["engine_attempt"]["exit_code"] == 0, manifest
          print("M02_REAL_DISCOVERY_PROBE_PASS", manifest["source_bundle_id"], attempt["status"])
          PY

      - name: M03 real wrapper smoke (explicit fragment, auditable review)
        shell: bash
        run: |
          set -euo pipefail
          nano-ar5iv --output "$RUNNER_TEMP/nano-m03" recover-wrapper \
            examples/trusted-fragment --fragment section.tex --documentclass article \
            > "$RUNNER_TEMP/m03-plan.json"
          nano-ar5iv --output "$RUNNER_TEMP/nano-m03" recover-wrapper \
            examples/trusted-fragment --fragment section.tex --documentclass article \
            --execute --timeout 180 > "$RUNNER_TEMP/m03-attempt.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plan = json.loads((root / "m03-plan.json").read_text())
          run = json.loads((root / "m03-attempt.json").read_text())
          assert plan["status"] == "PLANNED_REVIEW_REQUIRED", plan
          assert run["engine_status"] == "SUCCEEDED", run
          assert run["status"] == "REVIEW_REQUIRED", run
          assert run["quality_status"] == "NOT_EVALUATED", run
          assert run["original_files_unchanged"] is True, run
          assert run["attempt_count"] == 1, run
          assert run["original_bundle_id"] != run["derived_bundle_id"], run
          assert not (Path("examples/trusted-fragment") / "__nano_ar5iv_wrapper.tex").exists()
          manifest = json.loads(Path(run["attempt_manifest_path"]).read_text())
          assert manifest["root_entry"] == "__nano_ar5iv_wrapper.tex", manifest
          assert manifest["quality_status"] == "NOT_EVALUATED", manifest
          print("M03_REAL_WRAPPER_PASS", run["plan_id"], run["derived_bundle_id"])
          PY
